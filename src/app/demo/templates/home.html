<h1>Demo Time</h1>

<p>This is a demo.</p>

<p>This app:</p>

<ul>
  <li>doesn't know anything about better auth</li>
  <li>makes requests to <b>/whoami</b> to determine status of the user</li>
  <li>
    requests can be client-side (uses the browser cookies, like this demo)
  </li>
  <li>
    requests can be server-side (e.g. from Rails, but need to pass on cookies)
  </li>
</ul>

<div class="status alert" id="status"></div>

<script>
  try {
    fetch("/whoami", {
      method: "GET",
      headers: {
        Accept: "application/json",
      },
      credentials: "include",
    }).then((resp) => {
      resp.json().then((user) => {
        const status = document.getElementById("status");
        status.innerHTML = `<pre>${JSON.stringify(user, null, 2)}</pre>`;
        if (user.role == "guest") {
          status.classList.remove("alert-cb-success");
          status.classList.add("alert-cb-error");
          status.innerHTML += `<a href="/login?redirect_url=http://localhost:3000/demo" class="alert-link">Login here!</a>`;
        } else {
          status.classList.remove("alert-cb-error");
          status.classList.add("alert-cb-success");
          status.innerHTML += `<a href="/logout?redirect_url=http://localhost:3000/demo" class="alert-link">Logout!</a>`;
        }
      });
    });
  } catch (e) {
    console.log(`error: ${e}`);
  }
</script>
